AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB table for rate limiting in Internet Knowledge Map

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  # Rate Limit Table - tracks API request counts
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub knowledge-map-rate-limits-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: knowledge-map
        - Key: Purpose
          Value: rate-limiting

Outputs:
  RateLimitTableName:
    Description: Name of the Rate Limit table
    Value: !Ref RateLimitTable
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTable
  
  RateLimitTableArn:
    Description: ARN of the Rate Limit table
    Value: !GetAtt RateLimitTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTableArn
